name: Roger
options:
  bundleIdPrefix: com.jordiboehme
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.17.7"
    traits: []
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "3.1.0"
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: "0.12.1"

targets:
  Roger:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: UI
      - path: Services
      - path: Models
      - path: LLM
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: ../skills
        type: folder
        buildPhase: resources
      - path: Resources/Info.plist
        buildPhase: none
      - path: Resources/Roger.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordiboehme.roger
        MARKETING_VERSION: "0.25.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Roger.entitlements
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 77PA95K95V
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_NAME: Roger
    scheme:
      testTargets:
        - RogerTests
        - RogerKitTests
    dependencies:
      - target: RogerKit
      - target: roger-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
      - package: FluidAudio
        product: FluidAudio
      - package: KeyboardShortcuts
        product: KeyboardShortcuts

  RogerKit:
    type: library.static
    platform: macOS
    sources:
      - path: RogerKit
    settings:
      base:
        PRODUCT_NAME: RogerKit
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 77PA95K95V

  roger-mcp:
    type: tool
    platform: macOS
    sources:
      - path: RogerMCP
    dependencies:
      - target: RogerKit
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: roger-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.jordiboehme.roger.mcp
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 77PA95K95V

  RogerKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RogerKitTests
    dependencies:
      - target: RogerKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 77PA95K95V
        PRODUCT_BUNDLE_IDENTIFIER: com.jordiboehme.roger.kittests

  RogerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RogerTests
    dependencies:
      - target: Roger
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 77PA95K95V
        PRODUCT_BUNDLE_IDENTIFIER: com.jordiboehme.roger.tests

schemes:
  RogerKitTests:
    build:
      targets:
        RogerKit: all
        RogerKitTests: [test]
    test:
      targets:
        - RogerKitTests
