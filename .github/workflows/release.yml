name: Release

# Three ways in. The `notes` job resolves the release once and the release
# job reads its outputs, never the ref:
#
# - workflow_call: CI on main calls this after `ci-passed` when
#   MARKETING_VERSION has no tag yet (scripts/release-check.sh). The tag comes
#   from the `tag` input. github.ref and github.event_name are the caller's
#   here (refs/heads/main, push). The release job creates the tag at the
#   tested commit (github.sha) before it publishes.
# - push of a `v*` tag: the fallback. The tag is the pushed ref.
# - workflow_dispatch: a rehearsal from main. Every step except the GitHub
#   release and the tap update. Start it with: gh workflow run release.yml --ref main
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The tag to release, v<MARKETING_VERSION>
        type: string
        required: true
    secrets:
      DEVELOPER_ID_CERTIFICATE_BASE64:
        required: true
      DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true
      APPLE_ID:
        required: true
      APPLE_ID_PASSWORD:
        required: true
      TAP_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # Outputs:
  # - version: the version to build.
  # - tag: the release tag, empty for a rehearsal.
  # - publish: true when the run publishes (a call or a tag push).
  # - build: false only when a call finds its tag already at another commit,
  #   which means another release of this version won; the run then stops green.
  # - called: true for a call from CI, which has to create the tag.
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag: ${{ steps.version.outputs.TAG }}
      publish: ${{ steps.version.outputs.PUBLISH }}
      build: ${{ steps.version.outputs.BUILD }}
      called: ${{ steps.version.outputs.CALLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Allow rehearsals only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::A rehearsal runs only from main, not from $REF."
          exit 1

      # inputs.tag is set only by a call. In a call GITHUB_REF_TYPE is the
      # caller's (branch).
      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}[[:space:]]*$/\1/p' Roger/project.yml | head -n1)
          if [ -z "$pinned" ]; then
            echo "::error::No MARKETING_VERSION found in Roger/project.yml."
            exit 1
          fi
          build=true
          called=false
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
            publish=true
            called=true
            # The caller checked that the tag is new, but a second push to
            # main can pass that check while the first release still runs.
            # The tag at this commit is a re-run and goes on; the tag at
            # another commit means that release won, so this one stops here.
            at="$(bash scripts/release-check.sh tag-commit "$tag")"
            if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
              echo "release: $tag already points at $at, not at $GITHUB_SHA, so another run released it. Nothing to do."
              build=false
              publish=false
            fi
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            publish=true
          else
            tag=""
            publish=false
          fi
          if [ -n "$tag" ]; then
            version="${tag#v}"
            if [ "$version" != "$pinned" ]; then
              echo "::error::Tag $tag does not match MARKETING_VERSION $pinned in Roger/project.yml."
              exit 1
            fi
          else
            version="$pinned"
          fi
          echo "Version: $version, tag: ${tag:-none (rehearsal)}, publish: $publish"
          {
            echo "VERSION=$version"
            echo "TAG=$tag"
            echo "PUBLISH=$publish"
            echo "BUILD=$build"
            echo "CALLED=$called"
          } >> "$GITHUB_OUTPUT"

      - name: Check release notes file
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          f="release-notes/v${VERSION}.md"
          if [ ! -s "$f" ]; then
            echo "::error::$f is missing or empty. Add it to main (a merge releases again)."
            exit 1
          fi
          if ! head -n1 "$f" | grep -q '^# '; then
            echo "::error::$f must start with a '# ' heading (the release motto)."
            exit 1
          fi

  release:
    needs: notes
    if: needs.notes.outputs.build == 'true'
    runs-on: macos-26
    # The tag and the GitHub release.
    permissions:
      contents: write
    env:
      KEYCHAIN: build.keychain-db
      KEYCHAIN_PASSWORD: actions
      VERSION: ${{ needs.notes.outputs.version }}
      TAG: ${{ needs.notes.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build number counts the commits, so it needs the history.
          fetch-depth: 0

      # The commit count on main only grows, whichever workflow builds.
      - name: Build number
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/cert.XXXXXX.p12)
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_FILE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          rm "$CERT_FILE"

      - name: Archive
        run: |
          xcodebuild archive \
            -project Roger/Roger.xcodeproj \
            -scheme Roger \
            -configuration Release \
            -archivePath ${{ runner.temp }}/Roger.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            ARCHS=arm64 \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Write ExportOptions.plist
        run: |
          cat > ${{ runner.temp }}/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST

      - name: Export archive
        run: |
          xcodebuild -exportArchive \
            -archivePath ${{ runner.temp }}/Roger.xcarchive \
            -exportOptionsPlist ${{ runner.temp }}/ExportOptions.plist \
            -exportPath ${{ runner.temp }}/export

      - name: Check app bundle
        run: bash scripts/bundle-check.sh "${{ runner.temp }}/export/Roger.app"

      - name: Verify roger-mcp signature
        run: |
          APP="${{ runner.temp }}/export/Roger.app"
          BIN="$APP/Contents/MacOS/roger-mcp"
          test -x "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign -dv --verbose=4 "$BIN" > "${{ runner.temp }}/roger-mcp-sign.txt" 2>&1
          cat "${{ runner.temp }}/roger-mcp-sign.txt"
          grep -q "Authority=Developer ID Application" "${{ runner.temp }}/roger-mcp-sign.txt"
          grep -Eq "flags=0x[0-9a-f]*\(.*runtime.*\)" "${{ runner.temp }}/roger-mcp-sign.txt"
          # The same team as the app, and a secure timestamp (notarization
          # needs it; a signature without one shows "Signed Time=" instead).
          APP_TEAM=$(codesign -dv --verbose=4 "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          BIN_TEAM=$(sed -n 's/^TeamIdentifier=//p' "${{ runner.temp }}/roger-mcp-sign.txt")
          echo "Roger.app team: $APP_TEAM, roger-mcp team: $BIN_TEAM"
          test -n "$APP_TEAM"
          test "$APP_TEAM" != "not set"
          test "$APP_TEAM" = "$BIN_TEAM"
          grep -q "^Timestamp=" "${{ runner.temp }}/roger-mcp-sign.txt"
          codesign --verify --deep --strict --verbose=2 "$APP"
          "$BIN" --version

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent \
            "${{ runner.temp }}/export/Roger.app" \
            "${{ runner.temp }}/Roger-notarize.zip"

          xcrun notarytool submit \
            "${{ runner.temp }}/Roger-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "${{ runner.temp }}/export/Roger.app"

      - name: Check notarization of the app and the helper
        run: |
          APP="${{ runner.temp }}/export/Roger.app"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/roger-mcp"

      - name: Create DMG
        run: |
          DMG_NAME="Roger-${VERSION}.dmg"
          DMG_DIR=${{ runner.temp }}/dmg
          mkdir -p "$DMG_DIR"
          cp -R "${{ runner.temp }}/export/Roger.app" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create \
            -volname "Roger" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "${{ runner.temp }}/$DMG_NAME"
          echo "DMG_PATH=${{ runner.temp }}/$DMG_NAME" >> "$GITHUB_ENV"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "SHA256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      # Only for a call from CI. A tag made with GITHUB_TOKEN starts no other
      # workflow, so this run is the only release of it. The tag already at
      # this commit is a re-run after a failed publish; at another commit it is
      # an error, never moved.
      - name: Create the tag at the tested commit
        if: needs.notes.outputs.called == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          at="$(bash scripts/release-check.sh tag-commit "$TAG")"
          if [ -n "$at" ]; then
            if [ "$at" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already points at $at, not at the tested commit $GITHUB_SHA"
              exit 1
            fi
            echo "release: $TAG already points at $GITHUB_SHA"
            exit 0
          fi
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG" -f message="$TAG" -f object="$GITHUB_SHA" -f type=commit \
            --jq .sha)"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$object" > /dev/null
          echo "release: tagged $GITHUB_SHA as $TAG"

      - name: Create GitHub Release
        if: needs.notes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$DMG_PATH" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "release-notes/$TAG.md"

      - name: Update Homebrew tap
        if: needs.notes.outputs.publish == 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          SHA256="${{ steps.sha.outputs.SHA256 }}"

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/jordiboehme/homebrew-tap.git" \
            "${{ runner.temp }}/homebrew-tap"

          mkdir -p ${{ runner.temp }}/homebrew-tap/Casks

          cat > ${{ runner.temp }}/homebrew-tap/Casks/roger.rb << CASK
          cask "roger" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/jordiboehme/roger/releases/download/v#{version}/Roger-#{version}.dmg"
            name "Roger"
            desc "Menu bar app for speech-to-text dictation into any application"
            homepage "https://github.com/jordiboehme/roger"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on arch:  :arm64
            depends_on macos: :sequoia

            app "Roger.app"
            binary "#{appdir}/Roger.app/Contents/MacOS/roger-mcp"

            uninstall quit:   "com.jordiboehme.roger",
                      signal: ["TERM", "com.jordiboehme.roger"]

            zap trash: "~/Library/Preferences/com.jordiboehme.roger.plist"
          end
          CASK

          cd ${{ runner.temp }}/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/roger.rb
          git commit -m "Update roger to ${VERSION}"
          git push

      - name: Rehearsal summary
        if: needs.notes.outputs.publish != 'true'
        env:
          SHA256: ${{ steps.sha.outputs.SHA256 }}
        run: |
          msg="Rehearsal ok: ${VERSION}, DMG ${DMG_NAME}, sha256 ${SHA256}. Merge the release pull request to publish."
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
